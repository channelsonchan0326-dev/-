function choice(key,value,title,desc=''){return `<button class="choice" data-key="${key}" data-value="${value}" aria-pressed="${state[key]===value}"><strong>${title}</strong><small>${desc}</small></button>`}
function slider(key,title,names,left,right){return `<div class="rangebox"><div class="rangehead"><label for="${key}">${title}</label><output id="${key}Out">${names[state[key]-1]}</output></div><div class="ends"><span>${left}</span><span>${right}</span></div><input id="${key}" type="range" min="1" max="5" step="1" value="${state[key]}" aria-valuetext="${names[state[key]-1]}"><div class="ticks" aria-hidden="true">${[1,2,3,4,5].map(n=>`<span class="${state[key]===n?'active':''}">${n}</span>`).join('')}</div></div>`}
function summary(){const rows=[['奶',state.milk],['糖',state.sugar===null?null:state.sugar==='不加糖'?'不加糖':sweetNames[state.sweet-1]],...(state.sugar==='要糖'?[['糖醬',state.sauce==='原味'?'原味糖':state.sauce+'糖醬']]:[]),['方向',state.direction],['強度',step>=3?intensityNames[state.intensity-1]:null]];if(step===4)rows.push(['溫度／冰量',state.temp+(state.temp==='冰飲'?'・'+state.ice:'')]);$('summary').innerHTML=rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v||'尚未選擇'}</dd></div>`).join('')}
function drinks(){const f=state.direction==='偏酸'?'果酸':'醇苦';return state.milk==='加奶'?[{name:`${f}風味拿鐵`,desc:'奶香滑順，保留你選擇的咖啡風味。'},{name:`${f}風味馥芮白`,desc:'相較拿鐵，呈現更鮮明的咖啡感。'},{name:`${f}風味淡拿鐵`,desc:'奶感較突出，適合想喝柔和口感時。'}]:[{name:`${f}風味美式`,desc:'清爽直接，適合日常慢慢喝。'},{name:`${f}風味手沖`,desc:'以對應風味的咖啡豆，呈現香氣與層次。'}]}
function selectBox(key,label,opts){return `<label>${label}<select data-select="${key}">${opts.map(o=>`<option${state[key]===o?' selected':''}>${o}</option>`).join('')}</select></label>`}
function render(){ $('stepLabel').textContent=labels[step];$('stepCount').textContent=`${String(step+1).padStart(2,'0')} / 05`;$('progress').innerHTML=labels.map((_,i)=>`<i class="${i<=step?'done':''}"></i>`).join('');let html='';
if(step===0)html='<h1>這杯咖啡，要加奶嗎？</h1><p class="sub">先從你今天想喝的口感開始。</p><div class="choices">'+choice('milk','加奶','加奶','奶香滑順，咖啡口感更圓潤')+choice('milk','不加奶','不加奶','感受咖啡本身的香氣與味道')+'</div>';
if(step===1)html='<h1>想加一點甜嗎？</h1><p class="sub">依你的喜好，決定是否額外加糖。</p><div class="choices">'+choice('sugar','不加糖','不加糖','保留原本的風味')+choice('sugar','要糖','要糖','加上你喜歡的甜度')+'</div>'+(state.sugar==='要糖'?'<h2 class="sauce-title">選擇糖的口味</h2><div class="choices">'+choice('sauce','原味','原味','只加糖，不加風味糖醬')+choice('sauce','榛果','榛果糖醬','加入榛果風味')+choice('sauce','焦糖','焦糖糖醬','加入焦糖風味')+'</div><p class="note">風味糖醬本身含糖，甜度依所選糖醬的用量調整。</p>'+slider('sweet','你喜歡多甜？',sweetNames,'微甜','很甜'):'')+'<p class="note">不加糖指不額外添加糖；牛奶與原料仍可能含有糖分。</p>';
if(step===2)html='<h1>偏苦，還是偏酸？</h1><p class="sub">選一個你今天比較喜歡的風味方向。</p><div class="choices">'+choice('direction','偏苦','偏苦','巧克力・堅果・焦糖')+choice('direction','偏酸','偏酸','柑橘・熱帶水果・莓果')+'</div>';
if(step===3){let type=state.direction==='偏酸'?'酸味':'苦味';html=`<h1>喜歡多明顯的${type}？</h1><p class="sub">拖動拉條，選擇你喜歡的${type}程度。</p>`+slider('intensity',`${type}強度`,intensityNames,state.direction==='偏酸'?'柔和果酸':'柔和微苦',state.direction==='偏酸'?'明亮果酸':'濃烈苦感')+'<p class="note">這是口味偏好；實際表現會受到咖啡豆、配方與加奶影響。</p>'}
if(step===4){html='<h1>這杯，照你的喜歡。</h1><p class="sub">選一款示範飲品，再完成最後的調整。</p>';html+=drinks().map((d,i)=>`<button class="choice result" style="width:100%;min-height:auto" data-drink="${i}" aria-pressed="${state.selected===i}"><span class="pill">${i===0?'首選建議':'換個口感'}</span><h2>${d.name}</h2><p class="reason">${d.desc}</p></button>`).join('');html+='<div class="selects">'+selectBox('temp','冷熱',['冰飲','熱飲'])+(state.temp==='冰飲'?selectBox('ice','冰量',['去冰','微冰','少冰','標準冰']):'')+(state.milk==='加奶'?selectBox('milkAmount','奶量',['少奶','標準奶量','多奶']):'')+'</div><div class="result"><p class="eyebrow">出示給店員參考</p><h2>'+drinks()[state.selected].name+'</h2><p>'+[state.temp,state.temp==='冰飲'?state.ice:null,state.milk==='加奶'?state.milkAmount:null,state.sugar==='要糖'?(state.sauce==='原味'?'原味糖':state.sauce+'糖醬')+'・'+sweetNames[state.sweet-1]:'不加糖',`${state.direction==='偏酸'?'酸味':'苦味'}${intensityNames[state.intensity-1]}`].filter(Boolean).join(' · ')+'</p><p class="note">示範推薦，尚未連結店家菜單或送出訂單。請由店員確認現有豆款、原料與可製作配方；少冰、去冰與奶量調整依店家杯量規則處理。</p></div>'}
$('question').innerHTML=html;$('back').disabled=step===0;$('next').textContent=step===4?'重新選一杯 ↻':'下一步 →';$('next').disabled=step<3&&!state[['milk','sugar','direction'][step]];summary();
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key,v=b.dataset.value;state[k]=v;state.selected=0;render()});document.querySelectorAll('input[type=range]').forEach(el=>el.oninput=()=>{state[el.id]=Number(el.value);const names=el.id==='sweet'?sweetNames:intensityNames;$(el.id+'Out').textContent=names[el.value-1];el.setAttribute('aria-valuetext',names[el.value-1]);document.querySelectorAll('#'+el.id+' + .ticks span').forEach((tick,i)=>tick.classList.toggle('active',i+1===Number(el.value)));summary()});document.querySelectorAll('[data-drink]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.drink);render()});document.querySelectorAll('[data-select]').forEach(el=>el.onchange=()=>{state[el.dataset.select]=el.value;render()});}
$('next').onclick=()=>{if(step===4){Object.assign(state,{milk:null,sugar:null,sauce:'原味',sweet:2,direction:null,intensity:3,temp:'冰飲',ice:'標準冰',milkAmount:'標準奶量',selected:0});step=0}else step++;render();window.scrollTo({top:0});$('question').setAttribute('tabindex','-1');$('question').focus({preventScroll:true})};$('back').onclick=()=>{if(step>0)step--;render()};render();

</script></body></html>
