}
document.addEventListener('change', event => {
  if (event.target.matches('#coffee-form input, #coffee-form select')) changeChoice(event.target.name, event.target.value);
});
document.addEventListener('submit', event => {
  if (event.target.id === 'coffee-form') { event.preventDefault(); next(); }
});
document.addEventListener('click', event => {
  if (submitting) return;
  const button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  const action = button.dataset.action;
  if (action === 'assistance') { xiaojia.reset(); screen = 'assistance'; render(true); }
  if (action === 'assistance-back') { xiaojia.reset(); screen = 'cover'; render(true); }
  if (action === 'guided' || action === 'direct') start(action);
  if (action === 'back') back();
  if (action === 'home' || action === 'restart') { xiaojia.reset(); state = initialState(); lastOrder = null; screen = 'cover'; render(true); }
});
if (pendingOrder?.selection && DRINKS[pendingOrder.selection.drink]) {
  state = { ...initialState(), ...pendingOrder.selection };
  screen = 'finish';
  submitError = '上次送出的訂單尚未確認。請再次送出以確認結果，同一筆不會重複成立。';
}
render();

</script>
</body>
</html>
